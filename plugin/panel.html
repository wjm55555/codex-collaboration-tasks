<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>协作任务</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: var(--color-background-primary, light-dark(#fff, #212121));
        --side: var(--color-background-secondary, light-dark(#f8f8f7, #1c1c1c));
        --surface: var(--color-background-elevated-secondary, light-dark(#fff, #2a2a2a));
        --ink: var(--color-text-primary, light-dark(#262624, #f1f1ed));
        --sub: var(--color-text-secondary, light-dark(#5c5c59, #b9b9b5));
        --faint: var(--color-text-tertiary, light-dark(#676763, #aaa9a6));
        --stroke: var(--color-border-tertiary, light-dark(#e4e4e0, #3c3c39));
        --control: var(--color-border-secondary, light-dark(#cececa, #565652));
        --hover: color-mix(in srgb, var(--ink) 5%, var(--side));
        --selected: color-mix(in srgb, var(--ink) 8%, var(--side));
        --green: light-dark(#39704f, #8bb99a);
        --amber: light-dark(#95671b, #d8b46f);
        --red: var(--color-text-danger, light-dark(#a83931, #f4a09c));
        font: 14px/1.55 var(--font-sans, -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif);
        color: var(--ink);
        background: var(--canvas);
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body, h1, h2, h3, p { margin: 0; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; }
      button:disabled { cursor: default; opacity: .45; }
      :is(button, a, summary, input, select, textarea):focus-visible {
        outline: 2px solid var(--sub);
        outline-offset: 2px;
      }
      svg { display: block; width: 17px; height: 17px; flex: none; }
      [hidden] { display: none !important; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .frame {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        min-height: 0;
        margin: auto;
      }
      .top {
        position: relative;
        z-index: 6;
        display: flex;
        align-items: center;
        flex: none;
        gap: 9px;
        min-height: 56px;
        padding: 8px clamp(16px, 2vw, 30px);
        border-bottom: 1px solid var(--stroke);
      }
      .top h1 {
        white-space: nowrap;
        font-size: 16px;
        letter-spacing: -.025em;
        font-weight: 600;
      }
      #updatePanel { position: relative; }
      #updatePanel.has-update::after {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: #776bba; position: absolute; top: 3px; right: 3px;
      }
      #updatesDialog .update-label { display: flex; gap: 8px; align-items: center; margin: 16px 0 12px; }
      #updatesDialog .update-label input { min-height: 0; }
      #updatesDialog .update-actions { justify-content: flex-end; margin-top: 18px; }
      #updateStatus { margin-top: 12px; }
      #updateChecked { margin: 4px 0 0; }
      .mark { display: block; width: 26px; height: 26px; flex: none; }
      .spacer { flex: 1; }
      .soft, .solid, .ghost, .chip, .filter, .pick {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 32px;
        max-width: 100%;
        padding: 5px 11px;
        border-radius: 9px;
        font-size: 13px;
        line-height: 1.4;
        white-space: nowrap;
      }
      .soft, .pick {
        border: 1px solid var(--stroke);
        background: var(--surface);
      }
      .ghost, .filter { color: var(--sub); }
      :is(.ghost, .soft, .filter, .pick):hover { background: var(--hover); }
      .solid {
        border: 1px solid transparent;
        background: var(--ink);
        color: var(--canvas);
        font-weight: 560;
      }
      .solid:not(:disabled):hover { background: color-mix(in srgb, var(--ink) 87%, var(--canvas)); }
      :is(.solid, .soft, .ghost, .pick) svg { width: 15px; height: 15px; }
      .gear { position: relative; }
      .menu, .results {
        border: 1px solid var(--stroke);
        border-radius: 13px;
        background: var(--surface);
        box-shadow: 0 5px 22px #0002;
        padding: 5px;
        z-index: 5;
      }
      .menu { position: absolute; top: 39px; right: 0; width: 235px; }
      .menu button, .results button {
        display: block;
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        text-align: left;
        overflow-wrap: anywhere;
      }
      :is(.menu, .results) button:hover { background: var(--hover); }
      .menu button span, .results small {
        display: block;
        margin-top: 2px;
        color: var(--sub);
        font-size: 12px;
      }
      .menu b { font-weight: 590; }
      .modecheck { float: right; }
      dialog {
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--stroke);
        border-radius: 16px;
        padding: 18px;
        width: min(460px, calc(100% - 24px));
        max-height: calc(100% - 24px);
      }
      dialog::backdrop { background: #0005; }
      dialog h2 { margin: 0; font-size: 17px; }
      dialog .line { align-items: center; gap: 8px; flex-wrap: wrap; }
      dialog .device-list { display: grid; gap: 6px; margin: 12px 0; }
      dialog .device-row { padding: 8px 0; border-bottom: 1px solid var(--stroke); }
      dialog .device-row strong { flex: 1; overflow-wrap: anywhere; }
      dialog input, dialog select {
        min-height: 32px;
        min-width: 0;
        border: 1px solid var(--stroke);
        border-radius: 8px;
        padding: 4px 8px;
        color: var(--ink);
        background: var(--canvas);
      }
      dialog .notice { margin: 8px 0; }
      .shell {
        display: grid;
        grid-template-columns: clamp(225px, 24.5vw, 290px) minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      aside {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        padding: 19px 10px 0;
        background: var(--side);
        border-right: 1px solid var(--stroke);
      }
      .railhead {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 6px 12px 9px;
      }
      .mailboxes { display: flex; align-items: center; gap: 2px; }
      .mailboxes [aria-pressed="true"] { background: var(--selected); color: var(--ink); font-weight: 600; }
      .outbox-peers { display: flex; gap: 5px; margin: 0 6px 12px 9px; }
      .peer-select { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .outbox-peers .peer-select { flex: 1; }
      .recipient { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
      .recipient .peer-select { max-width: min(100%, 32ch); }
      #refresh, .filter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        border-radius: 7px;
        color: var(--sub);
      }
      #refresh { width: 28px; padding: 5px; }
      #refresh svg { width: 15px; height: 15px; }
      #refresh:hover { background: var(--hover); }
      .filter { padding: 3px 8px; font-size: 12px; }
      .filter[aria-pressed="true"] { background: var(--selected); color: var(--ink); }
      #list {
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding: 1px 1px 24px;
      }
      .item {
        display: block;
        width: 100%;
        margin-bottom: 3px;
        padding: 10px 11px;
        border-radius: 9px;
        text-align: left;
      }
      .item:hover { background: var(--hover); }
      .item[aria-current="true"] { background: var(--selected); }
      .item:focus-visible { outline-offset: -2px; }
      .item strong {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 14px;
        line-height: 1.5;
        font-weight: 450;
        overflow-wrap: anywhere;
      }
      .item[aria-current="true"] strong { font-weight: 590; }
      .item .line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 6px;
        color: var(--faint);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 5px;
        border-radius: 50%;
        background: var(--faint);
        vertical-align: 1px;
      }
      .dot.done { background: var(--green); }
      .dot.pending, .dot.review, .dot.waiting { background: var(--amber); }
      .dot.failed { background: var(--red); }
      .blankrail { padding: 12px 10px; color: var(--sub); font-size: 13px; }
      .content {
        min-height: 0;
        min-width: 0;
        overflow: auto;
        overscroll-behavior: contain;
        scroll-padding-block-end: clamp(80px, 18vh, 128px);
        padding: clamp(32px, 5vw, 64px) clamp(24px, 5vw, 72px) clamp(100px, 20vh, 160px);
      }
      .sheet { width: 100%; max-width: 720px; margin: 0 auto; }
      .over {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 11px;
        color: var(--sub);
        font-size: 12px;
      }
      .over svg { width: 14px; height: 14px; }
      .over > .ghost { padding: 3px 7px; min-height: 26px; font-size: 12px; }
      .sheet h2 {
        font-size: clamp(21px, 2.1vw, 27px);
        letter-spacing: -.032em;
        line-height: 1.42;
        font-weight: 610;
        overflow-wrap: anywhere;
      }
      .text { white-space: pre-wrap; overflow-wrap: anywhere; }
      .bodytext { margin-top: 14px; }
      .message { margin: 23px 0; }
      .message h3, .editor label, .label {
        display: block;
        margin-bottom: 8px;
        color: var(--sub);
        font-size: 13px;
        font-weight: 550;
      }
      .message p { line-height: 1.72; }
      .editor { margin-top: 25px; padding-top: 22px; border-top: 1px solid var(--stroke); }
      .editor h3 { margin-bottom: 8px; font-size: 16px; font-weight: 590; }
      .composer {
        padding: 11px 12px 9px;
        border: 1px solid var(--control);
        border-radius: 17px;
        background: var(--surface);
        box-shadow: 0 2px 5px #00000005;
      }
      .composer:focus-within { border-color: var(--faint); }
      .composer.drag { outline: 2px dashed var(--sub); outline-offset: 2px; }
      textarea {
        display: block;
        width: 100%;
        min-height: 90px;
        padding: 3px 3px 7px;
        resize: vertical;
        border: 0;
        background: transparent;
        font-size: 15px;
        line-height: 1.6;
      }
      textarea::placeholder, input::placeholder { color: var(--faint); opacity: 1; }
      .composer textarea:focus-visible { outline: 0; }
      .controls, .chips, .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
      }
      .controls { margin-top: 8px; }
      .controls .ghost { padding: 5px 7px; }
      .controls .solid { border-radius: 10px; }
      .chips:not(:empty) { margin: 12px 0; }
      .chip, .checkfile {
        border: 1px solid var(--stroke);
        border-radius: 8px;
        background: var(--surface);
      }
      .chip {
        justify-content: flex-start;
        min-width: 0;
        min-height: 30px;
        max-width: 100%;
        padding: 4px 8px;
        font-size: 12px;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .file-name { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chip:has(.file-name) { max-width: min(100%, 355px); }
      button.chip:hover { background: var(--hover); }
      .chip svg { width: 14px; height: 14px; color: var(--sub); }
      .chip button { min-width: 22px; align-self: stretch; padding: 0 3px; color: var(--sub); }
      .chip button:hover { background: var(--hover); border-radius: 6px; }
      .checkfile { display: inline-flex; align-items: center; min-width: 0; max-width: 100%; padding-right: 6px; }
      .checkfile input, .choice input { flex: none; accent-color: var(--ink); }
      .checkfile .chip { border: 0; }
      .targetline { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
      .targetline > span { color: var(--sub); font-size: 13px; }
      .pick {
        justify-content: flex-start;
        white-space: normal;
        overflow-wrap: anywhere;
        color: var(--ink);
      }
      .pick svg:last-child:not(:first-child) { margin-left: 2px; color: var(--sub); }
      .finder {
        margin: -5px 0 16px;
        padding: 6px;
        border: 1px solid var(--control);
        border-radius: 11px;
        background: var(--surface);
      }
      .finder input {
        width: 100%;
        padding: 7px 9px;
        border: 0;
        border-radius: 6px;
        background: var(--side);
      }
      .results { max-height: 208px; overflow: auto; border: 0; box-shadow: none; }
      .choice { display: inline-flex; align-items: center; gap: 5px; margin: 0 10px 6px 0; font-size: 12px; overflow-wrap: anywhere; }
      .hint, .notice, .compose-meta, .draft-note { margin: 9px 0; color: var(--sub); font-size: 12px; }
      .compose-meta { display: block; margin: 7px 2px 10px; }
      .compose-meta:empty { display: none; }
      .question { display: inline-block; vertical-align: middle; }
      .question[open] { display: block; }
      .question[open] .composer { margin-top: 5px; }
      :is(.question, .original) > summary {
        min-height: 30px;
        margin-left: -5px;
        padding: 4px 7px;
        list-style: none;
      }
      :is(.question, .original) > summary::-webkit-details-marker { display: none; }
      :is(.question, .original) > summary::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border: solid currentColor;
        border-width: 1px 1px 0 0;
        transform: rotate(45deg);
      }
      :is(.question, .original)[open] > summary::before { transform: rotate(135deg); }
      .question:not([open]) + .ghost { margin-inline-start: 4px; }
      .original { margin: 8px 0; }
      .error { color: var(--red); overflow-wrap: anywhere; }
      .error:empty { display: none; }
      .errorbar { flex: none; margin: 6px 20px; }
      #connection { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; padding: 7px clamp(12px, 2vw, 30px); color: var(--sub); background: var(--side); border-bottom: 1px solid var(--stroke); font-size: 13px; }
      #connectionText { overflow-wrap: anywhere; }
      #connection button { flex: none; min-height: 28px; padding: 3px 9px; font-size: 12px; font-weight: 560; }
      .empty {
        min-height: 235px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
      }
      .empty > svg {
        width: 40px;
        height: 40px;
        padding: 9px;
        margin-bottom: 4px;
        border-radius: 12px;
        background: var(--side);
        color: var(--sub);
      }
      .empty h2 { font-size: 19px; }
      .empty p { color: var(--sub); font-size: 13px; }
      .back { display: none; }
      .toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        z-index: 8;
        max-width: calc(100% - 24px);
        transform: translateX(-50%);
        padding: 6px 13px;
        border-radius: 18px;
        color: var(--canvas);
        background: var(--ink);
        font-size: 13px;
        text-align: center;
        pointer-events: none;
      }
      details > summary { cursor: pointer; color: var(--sub); }
      details > summary:hover { color: var(--ink); }
      @media (max-width: 670px) {
        .top { min-height: 52px; padding: 8px 12px; gap: 7px; }
        .top .soft, .top .solid { min-height: 32px; padding: 5px 9px; }
        .gear { position: static; }
        .menu { top: calc(100% - 3px); right: 10px; max-width: calc(100vw - 20px); }
        .shell { display: flex; flex-direction: column; }
        aside, .content { flex: 1; min-height: 0; }
        aside { padding: 15px 9px 0; border: 0; }
        .content { padding: 18px 17px 100px; }
        .frame[data-screen="list"] .content, .frame[data-screen="detail"] aside { display: none; }
        .back { display: inline-flex; min-height: 29px; margin: -6px 0 13px -6px; padding: 4px 7px; font-size: 12px; }
        .sheet h2 { font-size: 21px; }
        .item { padding: 10px 12px; }
      }
      @media (max-width: 460px) {
        .top { flex-wrap: wrap; gap: 5px; padding-inline: 10px; }
        .mark { display: none; }
        .top h1 { font-size: 15px; }
        .top .soft, .top .solid { padding-inline: 7px; font-size: 12px; }
        .top #mode svg:first-child, .top #new [data-icon] { display: none; }
        .top #new { margin-inline-start: auto; }
        .content { padding-inline: 14px; }
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame" data-screen="list">
      <header class="top">
        <img class="mark" alt="" width="26" height="26" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAYAAADimHc4AAAEB0lEQVR42u2dP2sUQRjG7yPcR8gHSS0pz7QqLNhYmSIKGiQcJCAqJkQLiygXDyRgEhUCCYLkj42Q5ppopUllIZIIYhWQcR/ZgzDMXvb2dvedd/Y5eLq7m3ee38zsu7vzp9EY4XNy8qcZqxWrHWs3Vi+WCVy9pK7tpO7NRtWfpOC3NTA7q+BFqyrjj2l4qo5LARH/6VjS7WhyNsGrsaLMj2L9oqlDC55Fo5q/SCNH1mJe8zs0rzB12PK19IRkzKdh5SjKku3wglvuhXlsEACmmhWkqINusmhQNWq5APAOt8I7ZrZ+n3oBH6zJPMA7/0iZhsioyeFHehhKXizQDBm1mftL3xPU5DWit683GzRBVl4CeL/dMwsP35lbUy/M9WtLlQvlonzEUSsAH/c+i5k+CAbiCh7As6dbXhlvC/EFC8B388uE0PBh2Emr8Mztrll6vGlWnu9UJpSHctNiKno4EgfgGvNhwO6HQ3P09aeYUL4LBOINBgCyDJf5Xw6/i5rfF+JwQSgyOxIFgFTPrpx0y3f1BDtGxB0EAHv4QWvzyfy+7F5Q5DAkCsBuWbgA+ggAcdmxBgkAWYiPABAXARAAARAAARCAWgBra5tmevqemZy8asbHL4mp1bpipm7OmJcrG/UAsLW1I276IBhrr7fDBTA7e99L423dvTMfHgAt5meBoA4Ahp20ikbRDTM398gsL3crF8pF+WmxpQ1H6gC4xnxU/OCgZ87O/ooLcbhA4JqgHgCyHZf5p6e/vTC/L8TjguDKjlQBQKppV8qXlu/qCXasSFFVA7CHH7QyH83vy+4FrmFIFQC7ReHC5zMAxGfHHBQAZB8+A0B8BEAABFBrAMhGir7pWl3dyJT61h6Ay4CiNDFx+UIItQcAk8p8xoOeMCoAVS/lQwSgalpKaEOQuolZIV2EVU5NDCUNVTs5NwQAqqenhwBA9QKNUAGoWaIUGgB1i/TyANjfPTRv1j9lFr5fJgDVy1SHBfCqu5drwRx+VxYA1Qu1hwUwyqpFAigAwIP59Vzm43cEUACAo28/zJOFzf+GZhW+j98RQKDvhFUD0D4rAvGrBqB9XhDiVw1A+8w4xK9+vyCtc0OrHn44O9oS4g5mxyxt6wMQb3BblmmBIGV+7deIIS6JYafWqyRRPuKoOttRtWti3bat5Matwhu3cuti4a2LuXm38Obd3L5eePt6HuAgeYADjzARPsKEh/h4cpQVj7ESPMaKvUC49fMow4pzfx7mKabBh3nyONvSFfFAZzkt8khzOXXynivPnlB1y0+5JvDCnO+CGzWK+CTZEVPUIVLNC7OdnCBavGMefIebepNVAgg+wDv3YK0S4x0gmgmMdtLt6vB6s5fUtZ3UvTmKh/8AN02oChK0U3MAAAAASUVORK5CYII=" />
        <h1>协作任务</h1>
        <span class="spacer"></span>
        <button type="button" class="soft" id="updatePanel" aria-haspopup="dialog">更新</button>
        <button type="button" class="soft" id="pendingDevices" hidden></button>
        <div class="gear" id="gear" hidden>
          <button
            id="mode"
            class="soft"
            aria-controls="menu"
            aria-expanded="false"
          ></button>
          <div
            class="menu"
            id="menu"
            role="group"
            aria-label="接单方式"
            hidden
          ></div>
        </div>
        <button class="solid" id="new" hidden>
          <span data-icon="plus"></span>新建任务
        </button>
      </header>
      <div id="connection" class="errorbar" hidden>
        <span id="connectionText" role="status"></span>
        <button class="soft" id="retry">重新连接</button>
        <button class="soft" id="reapply" hidden>重新申请</button>
      </div>
      <p class="error errorbar" role="alert" id="alert"></p>
      <div class="shell" id="taskShell">
        <aside>
          <div class="railhead">
            <div class="mailboxes" role="group" aria-label="任务方向">
              <button class="filter" id="inboxTab" aria-pressed="true">收件箱</button>
              <button class="filter" id="outboxTab" aria-pressed="false">我发出的</button>
            </div>
            <span class="spacer"></span>
            <button
              class="filter"
              id="refresh"
              aria-label="刷新任务"
              title="刷新任务"
              hidden
            >
              <span data-icon="refresh"></span>
            </button>
            <button class="filter" id="filter" aria-pressed="false" hidden>
              待处理
            </button>
          </div>
          <div class="outbox-peers" id="outboxPeers" hidden>
            <select class="soft peer-select" id="outPeer" aria-label="筛选接收设备"></select>
            <button class="ghost" id="addPeer">添加设备</button>
          </div>
          <nav id="list" aria-label="任务列表"></nav>
        </aside>
        <main class="content">
          <div class="sheet">
            <button class="back ghost" id="back">‹ 返回列表</button>
            <div id="detail">正在连接…</div>
          </div>
        </main>
      </div>
    </div>
    <dialog id="addPeerDialog" aria-labelledby="lanHeading">
      <div class="line">

      function stamp(ts) {
        const d = new Date(ts * 1000);
        return d.toDateString() === new Date().toDateString()
          ? d.toLocaleTimeString("zh-CN", {
              hour: "2-digit",
              minute: "2-digit",
            })
          : d.toLocaleDateString("zh-CN", { month: "short", day: "numeric" });
      }
      const attention = (task) =>
        ["pending", "failed", "review", "desktop_queued"].includes(
          task.status,
        ) ||
        (task.status === "waiting" && task.canReply);
      function stateName(t) {
        if (t.status === "review" && !data.owner) return "待接收方发回";
        if (t.status === "waiting")
          return t.canReply ? "待我补充" : "待发布者补充";
        return status[t.status] || t.status;
      }
      async function submitted(task, response, key, notice) {
        if (key) dropDraft(key);
        if (task) task.status = response.status;
        else {
          chosen = response.id;
          screen = "task";
          onlyPending = false;
          $("frame").dataset.screen = "detail";
        }
        signature = "";
        saveDrafts();
        paint();
        toast(notice);
        // The mutation already succeeded. Reconnect only the list if this read fails.
        try {
          await refresh(true);
        } catch (e) {
          connectionError(e);
        }
      }
      function questionForm(parent, t) {
        const key = "ask" + t.id,
          d = draft(key, ""),
          detail = el("details", "question"),
          heading = el("summary", "ghost", "请求补充");
        if (d.dirty && d.text) detail.open = true;
        detail.append(heading);
        composer(
          detail,
          d,
          "给发布者的问题",
          "发送问题",
          async () => {
            const r = await call("ask", { id: t.id, text: d.text });
            await submitted(t, r, key, "问题已发给发布者");
          },
          "需要对方补充哪些信息？",
          { files: false, needsText: true, hint: "这条问题会发给发布者。" },
        );
        parent.append(detail);
      }
      let localVersion = "0.7.2";
      let lanVersion, githubVersion, offeredUpdate;
      let updates = { status: "idle", autoInstall: false };
      let installingUpdate = false, updateResult = "", autoRetryAt = 0;
      const updateBusy = () => data.owner && data.tasks.some(
        (task) => ["queued", "desktop_queued", "running"].includes(task.status),
      );

      function updateOffer() {
        const later = (first, second) => {
          const parts = first.split(".").map(Number);
          const other = second.split(".").map(Number);
          const difference = parts.findIndex((part, i) => part !== other[i]);
          return difference >= 0 && parts[difference] > other[difference];
        };
        const lan = !canReceive && lanVersion && later(lanVersion, localVersion);
        const github = githubVersion && later(githubVersion, localVersion);
        const useGithub = github && (!lan || later(githubVersion, lanVersion));
        offeredUpdate = useGithub ? { source: "github", version: githubVersion }
          : lan ? { source: "lan", version: lanVersion } : null;
        $("updatePanel").classList.toggle("has-update", !!offeredUpdate);
        $("updatePanel").title = offeredUpdate ? "可更新到 " + offeredUpdate.version : "当前版本 " + localVersion;
        $("autoInstallUpdate").checked = updates.autoInstall === true;
        $("autoInstallUpdate").disabled = installingUpdate;
        $("checkUpdates").disabled = installingUpdate || updates.status === "checking";
        $("installUpdate").hidden = !offeredUpdate;
        $("installUpdate").disabled = installingUpdate || updateBusy();
        $("installUpdate").textContent = offeredUpdate ? "更新到 " + offeredUpdate.version : "";
        $("updateStatus").textContent = installingUpdate ? "正在下载并安装更新…"
          : updateResult || (offeredUpdate && updateBusy()
            ? updates.autoInstall ? "有任务正在执行，结束后自动更新" : "有任务正在执行，结束后可更新"
            : offeredUpdate ? "发现新版 " + offeredUpdate.version
              : updates.status === "ok" ? "已是最新版本"
                : updates.status === "error" ? "未能检查 GitHub 更新，可重试"
                  : updates.status === "disabled" ? "未配置 GitHub 更新来源" : "正在检查更新…");
        $("updateChecked").textContent = "当前版本 " + localVersion + (updates.checkedAt
          ? " · 上次检查 " + new Date(updates.checkedAt * 1000).toLocaleString("zh-CN", {
              month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
            }) : "");
      }

      async function installUpdate(automatic) {
        if (!offeredUpdate || installingUpdate || updateBusy()) return;
        const { source } = offeredUpdate;
        installingUpdate = true;
        updateResult = "";
        updateOffer();
        try {
          const result = await call("apply_update", { source, automatic });
          if (result.waiting) {
            autoRetryAt = Date.now() + 15000;
            updateResult = "有任务正在执行，安装已延后";
          } else {
            localVersion = result.version;
            updateResult = "已更新到 " + result.version + "，请重新打开面板。";
            toast(updateResult);
          }
        } catch (e) {
          autoRetryAt = Date.now() + 60000;
          updateResult = messageFor(e);
        } finally {
          installingUpdate = false;
          updateOffer();
        }
      }

      function maybeInstallUpdate() {
        if (updates.autoInstall && !disposed && !pageAway && !document.hidden && Date.now() >= autoRetryAt)
          installUpdate(true);
      }

      function paintReceiving() {

      async function showMailbox(target, peer = outPeer || peers[0]?.id || "") {
        saveDrafts();
        mailbox = target;
        outPeer = peer;
        screen = "initial";
        chosen = null;
        onlyPending = false;
        data = { owner: target === "inbox", tasks: [] };
        signature = "";
        $("frame").dataset.screen = "list";
        paint();
        await refresh(true);
      }
      $("inboxTab").onclick = () => act($("inboxTab"), () => showMailbox("inbox"));
      $("outboxTab").onclick = () => act($("outboxTab"), () => showMailbox("outbox"));
      $("outPeer").onchange = () => act($("outPeer"), () => showMailbox("outbox", $("outPeer").value));

      async function refresh(force = false) {
        if (disposed) return;
        const n = ++refreshSeq;
        const target = viewPeer();
        const v = await call("sync_state", {
          revision: force ? "" : data.revision || "",
          peer: target,
        });
        if (disposed || n !== refreshSeq) return;
        $("connection").hidden = true;
        syncDelay = v.syncError ? Math.min(syncDelay * 2, 15000) : 1600;
        updates = v.updates || updates;
        githubVersion = v.githubVersion;
        canReceive = v.receiver ?? canReceive;
        peers = v.peers ?? peers;
        const requestsChanged = (v.pendingDevices ?? pendingDevices) !== pendingDevices;
        pendingDevices = v.pendingDevices ?? pendingDevices;
        receivingMode = v.receivingMode ?? v.mode ?? receivingMode;
        paintReceiving();
        if (requestsChanged && $("deviceDialog").open)
          renderDevices().catch((e) => { $("deviceError").textContent = messageFor(e); });
        if (!canReceive && !target) return showMailbox("outbox");
        if (target === "outbox" && peers.length) {
          outPeer = peers[0].id;
          return refresh(true);
        }
        const nextPeers = JSON.stringify(peers);
        const peersChanged = nextPeers !== peerList;
        peerList = nextPeers;
        if (v.syncError) connectionError(Error(v.syncError), v.canReapply);
        if (!v.unchanged) {
          const scope = target ? "outbox/" + target : v.draftScope || "inbox";
          const restored = openDrafts(scope);
          const oldChosen = chosen;
          const oldTask = data.tasks.find((t) => t.id === chosen);
          data = { owner: !target && canReceive, tasks: [], ...v };
          lanVersion = v.updateVersion;
          if (screen === "initial") {
            screen = restored?.screen || "task";
            chosen = restored?.chosen || null;
            $("frame").dataset.screen = restored?.layout || "list";
          }
          if (screen === "task") {
            const visible = data.tasks.filter((t) => !onlyPending || attention(t));
            if (!visible.some((t) => t.id === chosen)) chosen = visible[0]?.id || null;
          }
          const sig = v.revision || JSON.stringify([v.connection, v.syncError, target]);
          if (sig !== signature || force || peersChanged) {
            const sameDetail = screen === "new" || (
              oldChosen === chosen &&
              JSON.stringify(oldTask) === JSON.stringify(data.tasks.find((t) => t.id === chosen))
            );
            paint(!!signature && !force && !peersChanged && sameDetail && (screen === "new" || !!chosen));
            signature = sig;
          }
        } else if (peersChanged) {
          paint(screen !== "new");
        }
        updateOffer();
        maybeInstallUpdate();
        scheduleRefresh();
      }
      $("updatePanel").onclick = () => {
        updateOffer();
        $("updatesDialog").showModal();
      };
      $("closeUpdates").onclick = () => $("updatesDialog").close();
      $("checkUpdates").onclick = async () => {
        $("checkUpdates").disabled = true;
        updateResult = "";
        try {
          updates = await call("check_updates");
          githubVersion = updates.version;
        } catch (e) {
          updateResult = messageFor(e);
        }
        updateOffer();
        maybeInstallUpdate();
      };
      $("autoInstallUpdate").onchange = async () => {
        const checkbox = $("autoInstallUpdate");
        checkbox.disabled = true;
        updateResult = "";
        try {
          updates = await call("set_auto_update", { enabled: checkbox.checked });
        } catch (e) {
          updateResult = messageFor(e);
        }
        updateOffer();
        maybeInstallUpdate();
      };
      $("installUpdate").onclick = () => installUpdate(false);
      $("new").onclick = () => {
        showNew();
        $("detail").querySelector("textarea")?.focus();
      };
      $("back").onclick = () => {
        if (screen === "new") {
          screen = "task";
          chosen = data.tasks[0]?.id || null;
          paint();
        }
        $("frame").dataset.screen = "list";
        saveDrafts();
        const row =
          $("list").querySelector('[aria-current="true"]') ||
          $("list").querySelector("button");
        (row || $("refresh")).focus();
      };
      $("refresh").onclick = () =>
        act($("refresh"), async () => {
          try {
            await refresh(true);
            toast("任务已更新");
          } catch (e) {
            connectionError(e);
          }
        });
      $("retry").onclick = () =>
        act($("retry"), async () => {
          if (!ready) await connect();
          else await refreshVisible();
        });
      $("filter").onclick = () => {
        onlyPending = !onlyPending;
        screen = "task";
        const visible = data.tasks.filter((t) => !onlyPending || attention(t));
        if (!visible.some((t) => t.id === chosen))
          chosen = visible[0]?.id || null;
        paint();
      };
      function closeMenu(restore = false) {
        $("menu").hidden = true;
        $("mode").setAttribute("aria-expanded", "false");
        if (restore) $("mode").focus();
      }
      $("mode").onclick = () => {
        const m = $("menu");
        if (!m.hidden) {
          closeMenu(true);
          return;
        }
        m.hidden = false;
        $("mode").setAttribute("aria-expanded", "true");
        m.replaceChildren();
        for (const [key, title, desc] of [
          ["manual", "默认手动接单", "接单时选择对话，并可编辑提示词。"],
          ["auto", "默认自动接单", "使用默认设置的设备发来任务时，自动执行并发回结果。"],
        ]) {
          const b = button("", "", async () => {
            await call("set_mode", { mode: key });
            closeMenu(true);
            receivingMode = key;
            paintReceiving();
            await refresh();
            toast("已切换为" + title);
          });
          b.setAttribute("aria-pressed", String(receivingMode === key));
          b.append(
            el("b", "", title),
            el("b", "modecheck", receivingMode === key ? "✓" : ""),
            el("span", "", desc),
          );
          m.append(b);
        }
        m.append(button("设备权限", "", openDevices));
        m.querySelector('[aria-pressed="true"]')?.focus();
      };
      async function openDevices() {
        closeMenu();
        $("deviceError").textContent = "";
        $("deviceList").replaceChildren(el("p", "notice", "正在读取设备权限…"));
        $("deviceDialog").showModal();
        await renderDevices();
      }
      $("pendingDevices").onclick = () => act($("pendingDevices"), openDevices);
      async function renderDevices() {
        const { devices, requests, defaultMode } = await call("devices");
        const list = $("deviceList");
        list.replaceChildren();
        for (const request of requests || []) {
          const row = el("div", "line device-row");
          const decide = async (allow) => {
            await call("decide_connection", { device: request.id, allow });
            await renderDevices();
            await refreshVisible();
            if (allow && request.mutual) toast("已建立双向连接");
          };
          row.append(
            el("strong", "", request.name + (request.mutual ? " 申请双向连接" : " 请求连接")),
            button("拒绝", "ghost", () => decide(false)),
            button("同意", "solid", () => decide(true)),
          );
          list.append(row);
        }
        if (!devices.length && !requests?.length)
          list.append(el("p", "notice", "暂无设备。协作者可以在同一 Wi-Fi 上找到你。"));
        for (const device of devices) {
          const row = el("div", "line device-row");
          const mode = el("select");
          mode.setAttribute("aria-label", device.name + "的接单方式");
          const inheritedMode = (defaultMode ?? receivingMode) === "auto" ? "自动接单" : "手动接单";
          for (const [value, label] of [["inherit", "使用默认（" + inheritedMode + "）"], ["manual", "单独设为手动接单"], ["auto", "单独设为自动接单"]]) {
            const option = el("option", "", label);
            option.value = value;
            mode.append(option);
          }
          mode.value = device.mode;
          mode.onchange = () => act(mode, async () => {
            try {
              await call("device_mode", { device: device.id, mode: mode.value });
              device.mode = mode.value;
            } catch (e) {
              mode.value = device.mode;
              throw e;
            }
          });
          const revoke = button("撤销", "ghost", async () => {
            if (revoke.textContent === "撤销") {
              revoke.textContent = "确认撤销";
              const notice = el("p", "notice", "对方将无法查看发给你的旧任务，重新授权后可以发送新任务。");
              list.insertBefore(notice, row.nextSibling);
              return;
            }
            await call("revoke_device", { device: device.id });
            await renderDevices();
          });
          row.append(el("strong", "", device.name), mode, revoke);
          list.append(row);
        }
      }
      $("closeDevices").onclick = () => $("deviceDialog").close();
      $("deviceDialog").onclose = () => $("mode").focus();
      document.addEventListener("click", (e) => {
        if (!$("gear").contains(e.target)) closeMenu();
      });
      window.addEventListener("focus", refreshVisible);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("menu").hidden) {
          e.preventDefault();
          closeMenu(true);
        }
      });
      function scheduleRefresh() {
        clearTimeout(pollTimer);
        if (!ready || disposed || pageAway || document.hidden) return;
        pollTimer = setTimeout(refreshVisible, syncDelay);
      }
      async function refreshVisible() {
        if (!ready || disposed || pageAway || document.hidden || applyingState) return;
        applyingState = true;
        try {
          await refresh();
        } catch (e) {
          syncDelay = Math.min(syncDelay * 2, 15000);
          if (!disposed) connectionError(e);
        } finally {
          applyingState = false;
          scheduleRefresh();
        }
      }
      document.addEventListener("visibilitychange", () => {
        clearTimeout(pollTimer);
        if (!document.hidden) refreshVisible();
      });
      window.addEventListener("pagehide", () => {
        pageAway = true;
        clearTimeout(pollTimer);
      });
      window.addEventListener("pageshow", (e) => {
        pageAway = false;
        if (e.persisted) refreshVisible();
      });
      async function connect() {
        try {
          if (embedded) {
            const r = await rpc("ui/initialize", {
              protocolVersion: "2026-01-26",
              appInfo: { name: "协作任务", version: "0.7.2" },
              appCapabilities: {
                availableDisplayModes: ["fullscreen", "inline"],
              },
            });
            parent.postMessage(
              {
                jsonrpc: "2.0",
                method: "ui/notifications/initialized",
                params: {},
              },
              "*",
            );
            theme(r?.hostContext);
          }
          ready = true;
          await refreshVisible();
        } catch (e) {
          connectionError(e);
        }
      }
      connect();
    </script>
  </body>
</html>
